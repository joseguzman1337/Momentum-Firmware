[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-esp32-mcp-bridge"
version = "1.1.0"
description = "MCP-compatible WebSocket bridge for the Momentum ESP32 LoRa agent"
requires-python = ">=3.11"
dependencies = [
  "websockets==17.1",
]

[project.scripts]
esp32-mcp-bridge = "mcp_server:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[tool.setuptools]
py-modules = ["mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
