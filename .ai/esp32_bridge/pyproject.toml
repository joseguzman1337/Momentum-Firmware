[build-system]
requires = ["setuptools==80.10.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-esp32-mcp-bridge"
version = "1.1.0"
description = "MCP-compatible WebSocket bridge for the Momentum ESP32 LoRa agent"
requires-python = ">=3.10"
dependencies = [
  "websockets==15.0.1",
]

[project.scripts]
esp32-mcp-bridge = "mcp_server:main"

[dependency-groups]
dev = [
  "pytest==9.0.3",
]

[tool.setuptools]
py-modules = ["mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

