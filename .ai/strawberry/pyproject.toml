[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strawberry"
version = "0.2.0"
description = "Operational toolkit for binding/routing information-theoretic evaluation (OpenAI + vLLM backends)"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "openai>=3.14.1",
  "numpy==2.5.3; platform_system != 'Linux'",
  "numpy==2.4.6; platform_system == 'Linux'",
  "pandas>=3.0.5",
  "tqdm>=4.70.1",
  "jsonschema>=4.26.0",
  "requests>=2.34.2",
]

[project.optional-dependencies]
vllm = [
  "vllm>=0.29.0; platform_system == 'Linux'",
  "transformers>=5.17.0; platform_system == 'Linux'",
  "torch==2.14.0; platform_system == 'Linux'",
]
mcp = [
  "mcp[cli]>=2.2.0",
]

[project.scripts]
strawberry = "strawberry.cli:main"
hallucination-detector-mcp = "strawberry.mcp_server:main"

[tool.uv]
# vLLM 0.29 pins setuptools below 81 even though Strawberry requires the
# security-fixed setuptools 84 release. Keep vLLM enabled while preventing
# the transitive constraint from reintroducing CVE-2026-59890.
override-dependencies = ["setuptools>=84.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
