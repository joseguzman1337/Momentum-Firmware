# Codex Configuration for Momentum Firmware
# AI-Powered Development Pipeline Configuration

# Default model and provider
model = "gpt-4o"
model_provider = "openai"
model_reasoning_effort = "high"

# Profile for automated development
profile = "momentum-dev"

# Approval and sandbox settings for the Codex client (independent of MCP capabilities)
approval_policy = "never"
sandbox_mode = "workspace-write"

[profiles.momentum-dev]
model = "gpt-4o"
model_reasoning_effort = "high"
approval_policy = "never"
sandbox_mode = "workspace-write"

[profiles.security-scan]
model = "gpt-4o"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-read"

[profiles.code-review]
model = "gpt-4o"
model_reasoning_effort = "high"
approval_policy = "on-failure"
sandbox_mode = "workspace-read"

# Feature flags for AI automation
[features]
unified_exec = true
shell_snapshot = true
web_search_request = true
parallel = true
skills = true
warnings = true
view_image_tool = true
apply_patch_freeform = true
exec_policy = true

# Sandbox configuration for firmware development
[sandbox_workspace_write]
exclude_tmpdir_env_var = false
exclude_slash_tmp = false
writable_roots = [
    ".",
    "/tmp",
    "~/.cache"
]
network_access = true

# Shell environment for firmware build tools
[shell_environment_policy]
inherit = "core"
include_only = [
    "PATH", "HOME", "USER", "SHELL",
    "CC", "CXX", "CFLAGS", "CXXFLAGS",
    "PYTHONPATH", "PYTHON3_PATH",
    "FBT_*", "FLIPPER_*",
    "GIT_*", "GITHUB_*"
]
exclude = ["AWS_*", "AZURE_*", "*_SECRET", "*_TOKEN", "*_KEY"]

# MCP servers for AI coordination
[mcp_servers.momentum-codex]
command = "python3"
args = [".ai/mcp/scripts/repo_agent_server.py"]
env = { LOG_DIR = "logs/codex", AUTO_MERGE = "identity-metadata-only", YOLO_MODE = "identity-metadata-only", PROJECT_ROOT = ".", MCP_AGENT_ROLE = "momentum-codex" }
description = "Read-only repository status compatibility adapter; legacy automation labels are identity metadata only"

[mcp_servers.security-agent]
command = "python3"
args = [".ai/mcp/scripts/repo_agent_server.py"]
env = { LOG_DIR = "logs/claude", AUTO_MERGE = "identity-metadata-only", SECURITY_SCAN = "identity-metadata-only", MCP_AGENT_ROLE = "security-agent" }
description = "Read-only repository status compatibility adapter; security and automation labels are identity metadata only"

[mcp_servers.quality-agent]
command = "python3"
args = [".ai/mcp/scripts/repo_agent_server.py"]
env = { LOG_DIR = "logs/warp", QUALITY_CHECK = "identity-metadata-only", MCP_AGENT_ROLE = "quality-agent" }
description = "Read-only repository status compatibility adapter; quality label is identity metadata only"

# Observability for AI pipeline monitoring
[otel]
environment = "momentum-firmware"
exporter = "none"
log_user_prompt = false

# Notifications for automation events
notify = ["python3", ".ai/scripts/notify.py"]

# Model providers configuration
[model_providers.openai]
name = "OpenAI"
base_url = "https://api.openai.com/v1"
env_key = "OPENAI_API_KEY"
request_max_retries = 3
stream_max_retries = 5
stream_idle_timeout_ms = 180000

[model_providers.anthropic]
name = "Anthropic"
base_url = "https://api.anthropic.com/v1"
env_key = "ANTHROPIC_API_KEY"

[model_providers.google]
name = "Google"
base_url = "https://generativelanguage.googleapis.com/v1beta"
env_key = "GOOGLE_API_KEY"
