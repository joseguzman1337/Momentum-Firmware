# Unified MCP Configuration for Momentum Firmware
# Model Context Protocol servers for AI-powered development pipeline

# Compatibility registrations for named AI roles. These entries intentionally
# expose the same read-only repository-status MCP; role names and env flags are
# metadata only and do not claim cloud, security, merge, or generation actions.
# Provider-specific integrations may be registered separately when available.
[mcp_servers.momentum-codex]
command = "python3"
args = [".ai/mcp/scripts/repo_agent_server.py"]
env = { LOG_DIR = "logs/codex", AUTO_MERGE = "identity-metadata-only", YOLO_MODE = "identity-metadata-only", PROJECT_ROOT = ".", MCP_AGENT_ROLE = "momentum-codex" }
description = "Read-only repository status adapter; legacy automation labels are identity metadata only"
startup_timeout_sec = 30
tool_timeout_sec = 300
enabled = true

[mcp_servers.codex-cloud]
command = "python3"
args = [".ai/mcp/scripts/repo_agent_server.py"]
env = { LOG_DIR = "logs/codex-cloud", AUTO_MERGE = "identity-metadata-only", CLOUD_MODE = "identity-metadata-only", MCP_AGENT_ROLE = "codex-cloud" }
description = "Read-only repository status adapter; cloud and automation labels are identity metadata only"
startup_timeout_sec = 45
tool_timeout_sec = 600
