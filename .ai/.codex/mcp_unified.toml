tool_timeout_sec = 60
enabled = true

[mcp_servers.agent-communication]
command = "python3"
args = [".ai/mcp/scripts/a2a_server.py"]
env = { MESSAGE_BUS = ".ai/workflows/message_bus.json", COORDINATION_MODE = "true" }
